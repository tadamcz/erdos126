status:
  scope: 'Fully formalized: the compared theorem `Erdos126.erdos_126` in `Challenge.lean` is proved in `Solution.lean`
    via the imported module `Erdos126.Resolutions.Erdos126_132usd_25h` with no `sorry` and no axioms beyond propext,
