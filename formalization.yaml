    proofs of the same statement, built as the separate Lake library `Erdos126Alternates` but not compared by Comparator.
    Only the conjectured statement is advertised; stronger quantitative bounds visible inside the proofs are not
    part of the compared statement. Nothing about the informal problem was omitted or weakened relative to the benchmark''s
    formal statement; see fidelity.divergences for the relation between that formal statement and the informal problem.'
