fidelity:
  divergences: 'The compared theorem is exactly the Formal Conjectures statement. The definition `IsMaximalAddFactorsCard
    f` says that for every `n`, `f n` is the greatest `m` such that every `n`-element `A : Finset ℕ` has at least
    `m` distinct prime factors in `∏_{(a,b) ∈ A.offDiag} (a + b)` (product over ordered pairs `a ≠ b`; the same
    prime set as over unordered pairs). Such an `f` exists and is unique (the primary resolution verifies existence,
    uniqueness and monotonicity in its `Independent126` section), so the hypothesis is not vacuous; `A` may contain
    `0`, which changes `|S(A)|` by at most one relative to positive sets. The conclusion `Tendsto (fun n => f n
    / Real.log n) atTop atTop` coerces `f n` to `ℝ`; `Real.log n` is positive for `n ≥ 2`. The stronger polynomial
    bounds proved internally are not part of the compared statement.'
review:
  status: 'mechanically verified (Comparator: Lean kernel replay, standard axioms only) in the benchmark harness
    and again in this repository''s CI; preliminary informal reading of the argument by Thomas F. Bloom; no independent
    refereeing'
  reviewers:
  - Thomas F. Bloom
  notes: 'Statement audit: the formal statement was selected and reviewed for faithfulness to the informal problem
    by Thomas F. Bloom before the benchmark run (for Formal Conjectures statements he chose the representative statement;
    autoformalized statements he checked individually). Mathematical review: the resolution was verified by Comparator
    against the trusted statement; Thomas F. Bloom made an initial, informal examination of the argument and wrote
    a short exposition (FrontierMath Erdős appendix and erdosproblems.com). The paper states that the proofs have
    not yet been properly digested by human experts.'
