sources:
- title: 'Proof of Erdős problem #126: If f(n) is the least number of distinct primes dividing ∏_{a≠b∈A}(a+b) over
    n-element sets A ⊆ ℕ, then f(n)/log n → ∞.'
  type: original-proof
  relationship: other
  note: This formalization is the first presentation of the result. The Lean proof was found by a pre-release version
    of GPT-6 Astra, working autonomously in the FrontierMath Erdős benchmark harness; no human wrote or steered
    the proof. Novelty of the ideas relative to the literature has not been established; the resolution itself is
    new (the problem was listed as open on erdosproblems.com as of August 2026).
