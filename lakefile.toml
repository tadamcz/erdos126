name = "Erdos126"
version = "0.1.0"
defaultTargets = ["Erdos126", "Erdos126Alternates", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# The primary resolution: `Erdos126.lean` imports it, and `Solution.lean` imports it in turn.
[[lean_lib]]
name = "Erdos126"

# Further independent resolutions of the same statement. Each is a self-contained copy of the
# benchmark statement followed by its own proof, so they are built separately and never imported
# together (they would clash on the shared declaration names).
[[lean_lib]]
name = "Erdos126Alternates"
roots = ["Erdos126.Resolutions.Erdos126_81usd_13h", "Erdos126.Resolutions.Erdos126_104usd_15h", "Erdos126.Resolutions.Erdos126_133usd_17h"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
